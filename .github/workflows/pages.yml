name: Publicar COINPRE WEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar Node para validar el correo
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar formularios y correos sin enviar mensajes
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Preparar pagina web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public_html

      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
